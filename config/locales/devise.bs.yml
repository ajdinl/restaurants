# Fills the keys left empty in devise-i18n's bs.yml (only the Devise modules we use).
bs:
  devise:
    failure:
      invalid: "Pogrešan %{authentication_keys} ili lozinka."
      not_found_in_database: "Pogrešan %{authentication_keys} ili lozinka."
    mailer:
      password_change:
        greeting: "Zdravo, %{recipient}!"
        message: "Javljamo vam da je vaša lozinka promijenjena."
        subject: "Lozinka promijenjena"
      reset_password_instructions:
        action: "Promijeni lozinku"
        greeting: "Zdravo, %{recipient}!"
        instruction: "Neko je zatražio link za promjenu vaše lozinke. To možete uraditi preko linka ispod."
        instruction_2: "Ako to niste bili vi, zanemarite ovaj email."
        instruction_3: "Lozinka se neće promijeniti dok ne otvorite link iznad i ne postavite novu."
      unlock_instructions:
        action: "Otključaj račun"
        greeting: "Zdravo, %{recipient}!"
        instruction: "Kliknite na link ispod da otključate račun:"
        message: "Vaš račun je zaključan zbog previše neuspješnih pokušaja prijave."
    passwords:
      edit:
        change_my_password: "Promijeni lozinku"
        change_your_password: "Promjena lozinke"
        confirm_new_password: "Potvrdite novu lozinku"
        new_password: "Nova lozinka"
      new:
        forgot_your_password: "Zaboravili ste lozinku?"
        send_me_reset_password_instructions: "Pošalji upute za promjenu lozinke"
    sessions:
      already_signed_out: "Uspješno ste se odjavili."
      new:
        sign_in: "Prijava"
    shared:
      links:
        back: "Nazad"
        forgot_your_password: "Zaboravili ste lozinku?"
        sign_in: "Prijava"
      minimum_password_length:
        one: "(najmanje %{count} znak)"
        few: "(najmanje %{count} znaka)"
        other: "(najmanje %{count} znakova)"
