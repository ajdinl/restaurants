version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    minor-and-patch:
      update-types: [minor, patch]
- package-ecosystem: npm
  directory: "/frontend"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  ignore:
    # Types must match the Node runtime (22); bump together with Node.
    - dependency-name: "@types/node"
      update-types: ["version-update:semver-major"]
  groups:
    minor-and-patch:
      update-types: [minor, patch]
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    actions:
      patterns: ["*"]
